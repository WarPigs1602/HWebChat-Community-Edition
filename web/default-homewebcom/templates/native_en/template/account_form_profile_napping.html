<!-- design=napping_account -->
<h1>%SERVER_SOFTWARE% - Account</h1>

<form action="%PATH_[account]%" method="POST" accept-charset="utf-8">%account_error_if_one%
  <input type="hidden" name="service" value="account">
  <input type="hidden" name="data" value="change">
  <input type="hidden" name="owner" value="%owner%">

  <p class="form-section-title">Personal Information</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Homepage</label>
      <input type="url" class="form-control form-control-sm" name="homepage" value="%homepage%" placeholder="https://">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">City</label>
      <input type="text" class="form-control form-control-sm" name="city" value="%city%" placeholder="City">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Hobby</label>
      <input type="text" class="form-control form-control-sm" name="hobby" value="%hobby%" placeholder="Hobbies">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Family status</label>
      <input type="text" class="form-control form-control-sm" name="fam_status" value="%fam_status%" placeholder="e.g. Single">
    </div>
  </div>

  <p class="form-section-title">About me</p>

  <div class="mb-3">
    <label class="form-label fw-semibold small">Description</label>
    <textarea class="form-control form-control-sm" name="description" rows="3" placeholder="Tell us about yourself...">%description%</textarea>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Motto</label>
      <input type="text" class="form-control form-control-sm" name="slogan" value="%slogan%" placeholder="Your motto">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Signature</label>
      <input type="text" class="form-control form-control-sm" name="signature" value="%signature%" placeholder="Signature">
    </div>
  </div>

  <p class="form-section-title">Contact & Social</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Facebook</label>
      <input type="text" class="form-control form-control-sm" name="facebook" value="%facebook%" placeholder="Facebook Profile">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Twitter / X</label>
      <input type="text" class="form-control form-control-sm" name="twitter" value="%twitter%" placeholder="@username">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">YouTube</label>
      <input type="text" class="form-control form-control-sm" name="youtube" value="%youtube%" placeholder="YouTube Channel">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Instagram</label>
      <input type="text" class="form-control form-control-sm" name="instagram" value="%instagram%" placeholder="@username">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">LinkedIn</label>
      <input type="text" class="form-control form-control-sm" name="linkedin" value="%linkedin%" placeholder="Username">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">TikTok</label>
      <input type="text" class="form-control form-control-sm" name="tiktok" value="%tiktok%" placeholder="@username">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Discord</label>
      <input type="text" class="form-control form-control-sm" name="discord" value="%discord%" placeholder="Username">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Twitch</label>
      <input type="text" class="form-control form-control-sm" name="twitch" value="%twitch%" placeholder="Username">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">GitHub</label>
      <input type="text" class="form-control form-control-sm" name="github" value="%github%" placeholder="Username">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Reddit</label>
      <input type="text" class="form-control form-control-sm" name="reddit" value="%reddit%" placeholder="Username">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Snapchat</label>
      <input type="text" class="form-control form-control-sm" name="snapchat" value="%snapchat%" placeholder="Username">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Pinterest</label>
      <input type="text" class="form-control form-control-sm" name="pinterest" value="%pinterest%" placeholder="Username">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">WhatsApp</label>
      <input type="text" class="form-control form-control-sm" name="whatsapp" value="%whatsapp%" placeholder="Phone number with country code">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Telegram</label>
      <input type="text" class="form-control form-control-sm" name="telegram" value="%telegram%" placeholder="@username">
    </div>
  </div>

  <p class="form-section-title">Save</p>

  <input type="submit" class="btn btn-primary btn-sm" name="OK" value="Submit change">
</form>
