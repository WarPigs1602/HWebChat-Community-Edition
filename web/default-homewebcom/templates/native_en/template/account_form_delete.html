<!-- design=account -->
<h1>%SERVER_SOFTWARE% &ndash; Delete account</h1>

<form action="%PATH_[account]%" method="POST" accept-charset="utf-8">%account_error_if_one%
  <input type="hidden" name="service" value="delete">
  <input type="hidden" name="data" value="delete">

  <p class="form-section-title">Required information</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Your password</label>
      <input type="password" class="form-control form-control-sm" name="pwd" value="" placeholder="Password">
      <span class="form-hint">Should be at least four characters long!</span>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Repeat your password</label>
      <input type="password" class="form-control form-control-sm" name="pwd2" value="" placeholder="Repeat password">
      <span class="form-hint">To make sure you didn't make a mistake!</span>
    </div>
  </div>

  <p class="form-section-title">Confirm</p>

  <input type="submit" class="btn btn-danger btn-sm" name="OK" value="Delete account">
</form>
