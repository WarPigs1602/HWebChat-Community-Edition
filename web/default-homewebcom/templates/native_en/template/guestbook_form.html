<div class="guestbook-form mt-3">
  <form action="%PATH_[profile]%" method="get" accept-charset="utf-8">
    <input type="hidden" name="page" value="%path_profile%">
    <input type="hidden" name="user" value="%user%">
    <input type="hidden" name="skin" value="%skin%">
    <input type="hidden" name="owner" value="%owner%">
    <input type="hidden" name="guestbook" value="1">
    <div class="input-group">
      <textarea class="form-control form-control-sm" name="guestbook_text" rows="2" placeholder="Write a guestbook entry..."></textarea>
      <button class="btn btn-primary btn-sm" type="submit">Submit</button>
    </div>
  </form>
</div>
