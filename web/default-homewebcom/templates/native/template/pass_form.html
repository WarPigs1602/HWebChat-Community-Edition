<!-- design=start -->
<h1>
%SERVER_SOFTWARE% &ndash; Passwort anfordern
</h1>
<form action="%PATH_[password]%" method="POST" accept-charset="utf-8">%reg_error_if_one%
  <input type="hidden" name="service" value="pass_done">
  <input type="hidden" name="owner" value="%owner%">
  <p class="form-section-title">
    Notwendige Angaben
  </p>
  <p>
  <input type="text" size="50" maxlength="255" class="form-control form-control-sm mb-2" name="reg_nick" value="%reg_nick%" placeholder="Dein Nickname">
        <div class="input-group mb-2">
  <select class="form-control form-control-sm col-md-1" name="reg_day" size="1" aria-label="Tag">
    <option value="01">01</option>
    <option value="02">02</option>
    <option value="03">03</option>
    <option value="04">04</option>
    <option value="05">05</option>
    <option value="06">06</option>
    <option value="07">07</option>
    <option value="08">08</option>
    <option value="09">09</option>
    <option value="10">10</option>
    <option value="11">11</option>
    <option value="12">12</option>
    <option value="13">13</option>
    <option value="14">14</option>
    <option value="15">15</option>
    <option value="16">16</option>
    <option value="17">17</option>
    <option value="18">18</option>
    <option value="19">19</option>
    <option value="20">20</option>
    <option value="21">21</option>
    <option value="22">22</option>
    <option value="23">23</option>
    <option value="24">24</option>
    <option value="25">25</option>
    <option value="26">26</option>
    <option value="27">27</option>
    <option value="28">28</option>
    <option value="29">29</option>
    <option value="30">30</option>
    <option value="31">31</option>
  </select>
  <select class="form-control form-control-sm col-md-2" name="reg_month" size="1" aria-label="Monat">
    <option value="01">Januar</option>
    <option value="02">Februar</option>
    <option value="03">März</option>
    <option value="04">April</option>
    <option value="05">Mai</option>
    <option value="06">Juni</option>
    <option value="07">Juli</option>
    <option value="08">August</option>
    <option value="09">September</option>
    <option value="10">Oktober</option>
    <option value="11">November</option>
    <option value="12">Dezember</option>
  </select>
  <select class="form-control form-control-sm col-md-2" name="reg_year" size="1" aria-label="Jahr">
    <option value="2026" selected>2026</option>
  </select>
  </div>
  <input type="email" size="50" maxlength="255" class="form-control form-control-sm mb-2" name="reg_mail" value="%reg_mail%" placeholder="Deine E-Mailadresse">
  </p>
  <p class="form-section-title">
    Sicherheitscode
  </p>
  <p>
    <img src="%PATH_[captcha]%" alt="Captcha" id="captcha_image" style="vertical-align: middle;"/><button type="button" class="btn btn-outline-secondary btn-sm ms-2" onclick="refreshCaptcha()" title="Captcha neu laden">&#x21bb;</button><br>
    <input type="text" size="10" maxlength="10" class="form-control form-control-sm mb-2" name="reg_captcha" value="%reg_captcha%" placeholder="Bitte genaue Schreibweise beachten"/>
    <input type="hidden" name="reg_cid" value="%reg_cid%"/>
  </p>
  <p class="form-section-title">
    Und weiter&hellip;
  </p>
  <p>
  <input type="submit" class="btn btn-secondary btn-sm" name="OK" value="Neues Passwort anfordern">
  </p>
</form>
<script>
function refreshCaptcha() {
    var img = document.getElementById('captcha_image');
    if (img) {
        img.src = img.src.split('&t=')[0] + '&t=' + new Date().getTime();
    }
}
</script>
<script>
(function() {
    var regDay = '%reg_day%';
    if (regDay) {
        var daySelect = document.querySelector('select[name="reg_day"]');
        if (daySelect) daySelect.value = regDay;
    }
    var regMonth = '%reg_month%';
    if (regMonth) {
        var monthSelect = document.querySelector('select[name="reg_month"]');
        if (monthSelect) monthSelect.value = regMonth;
    }
    var yearSelect = document.querySelector('select[name="reg_year"]');
    if (yearSelect) {
        var currentYear = new Date().getFullYear();
        var startYear = currentYear - 100;
        var endYear = currentYear - 13;
        yearSelect.innerHTML = '';
        for (var year = startYear; year <= endYear; year++) {
            var option = document.createElement('option');
            option.value = year;
            option.text = year;
            yearSelect.appendChild(option);
        }
        var regYear = '%reg_year%';
        if (regYear) {
            yearSelect.value = regYear;
        } else {
            yearSelect.value = currentYear;
        }
    }
})();
</script>
