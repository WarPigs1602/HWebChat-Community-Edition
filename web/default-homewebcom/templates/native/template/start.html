<!-- design=start -->
<main class="start-page">
  <section class="start-overview">
    <div class="start-intro">
      <h1>Herzlich willkommen im %SERVER_SOFTWARE%</h1>
    </div>

    <aside class="start-login" aria-labelledby="start-login-title">
      <div class="start-login-heading">
        <span class="start-login-icon"><i class="fa fa-sign-in" aria-hidden="true"></i></span>
        <div>
          <h2 id="start-login-title">Einloggen</h2>
          <p>Schön, dass du wieder da bist.</p>
        </div>
      </div>
      <form method="POST" name="login" action="%PATH_[login]%" target="_top" accept-charset="utf-8">
        <input type="hidden" name="skin" value="%skin%">
        <div class="form-group">
          <label for="start-nick">Nickname</label>
          <input class="form-control" id="start-nick" maxlength="20" name="nick" type="text" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="start-pwd">Passwort</label>
          <input class="form-control" id="start-pwd" maxlength="20" name="pwd" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit"><i class="fa fa-sign-in" aria-hidden="true"></i> Jetzt einloggen</button>
      </form>
      <div class="start-login-links">
        <a href="%PATH_[register]%"><i class="fa fa-user-plus" aria-hidden="true"></i> Konto erstellen</a>
        <a href="%PATH_[password]%"><i class="fa fa-key" aria-hidden="true"></i> Passwort vergessen?</a>
      </div>
      <a class="start-guest-link" href="%PATH_[login]%&amp;skin=%skin%"><i class="fa fa-user-o" aria-hidden="true"></i> Als Gast ohne Passwort einloggen</a>
    </aside>
  </section>
  %homepage_extra%
</main>
