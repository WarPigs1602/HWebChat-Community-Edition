doc.dataprotection.controller_means_the_natural_or=‘controller’ means the natural or legal person, authority, body or other body which alone or jointly with others decides on the purposes and means of processing personal data.
doc.dataprotection.cookies_and_right_of_objection=Cookies and right of objection in direct advertising
doc.dataprotection.cookies_are_small_files_that=“Cookies” are small files that are stored on users’ computers. Different information can be stored within the cookies. A cookie is primarily used to store the information about a user (or the device on which the cookie is stored) during or after his visit within an online offer. Temporary cookies, or “session cookies” or “transient cookies”, are cookies that are deleted after a user leaves an online offer and closes his browser. In such a cookie, for example, the contents of a shopping cart can be stored in an online shop or a login status. “Permanent” or “persistent” are cookies that remain stored even after the browser is closed. For example, the login status can be stored if the users visit it after several days. Likewise, such a cookie can store the interests of the users, which are used for range measurement or marketing purposes. “Third-party cookie” refers to cookies that are offered by providers other than the person responsible for the online offer (otherwise, if only its cookies are referred to as “first-party cookies”
doc.dataprotection.cooperation_with_processors_joint_controllers=Cooperation with processors, joint controllers and third parties
doc.dataprotection.created_with_datenschutz_generator_de=Created with Datenschutz-Generator.de by RA Dr. Thomas Schwenke
doc.dataprotection.data_protection={0}Data protection
doc.dataprotection.deletion_of_data=Deletion of data
doc.dataprotection.here_we_or_our_hosting=Here, we or our hosting provider process inventory data, contact data, content data, contract data, usage data, meta and communication data of customers, interested parties and visitors of this online offer on the basis of our legitimate interests in an efficient and secure provision of this online offer acc. Art. 6 para 1 lit. f GDPR i.V.m. Art. 28 GDPR (conclusion of order processing contract
doc.dataprotection.hosting_and_e_mail=Hosting and e-mail
doc.dataprotection.if_the_data_are_not=If the data are not deleted because they are necessary for other and legally permitted purposes, their processing will be restricted. This means that the data is blocked and not processed for other purposes. This applies, for example, to data that must be kept for commercial or tax reasons.
doc.dataprotection.if_users_do_not_want=If users do not want cookies to be stored on their computer, they are asked to deactivate the corresponding option in the system settings of their browser. Stored cookies can be deleted in the system settings of the browser. The exclusion of cookies can lead to functional restrictions of this online offer.
doc.dataprotection.if_we_disclose_data_to=If we disclose data to other persons and companies (processors, joint controllers or third parties) in the context of our processing, transfer them to them or otherwise grant them access to the data, this is only done on the basis of a legal permission (e.g. if a transfer of the data to third parties, such as to payment service providers, is necessary for the performance of the contract), users have consented, a legal obligation provides for this or on the basis of our legitimate interests (e.g. when using agents, web hosts
doc.dataprotection.if_we_disclose_transmit_or=If we disclose, transmit or otherwise grant access to data to other companies in our group of companies, this is done in particular for administrative purposes as a legitimate interest and, in addition, on a basis corresponding to the legal requirements.
doc.dataprotection.if_we_process_data_in=If we process data in a third country (i.e. outside the European Union (EU), the European Economic Area (EEA) or the Swiss Confederation) or this is done in the context of the use of third-party services or the disclosure or transfer of data to other persons or companies, this will only be done if it is done to fulfill our (pre)contractual obligations, on the basis of your consent, on the basis of a legal obligation or on the basis of our legitimate interests. Subject to legal or contractual permissions, we process or leave the data in a third country only if the legal requirements are met. This means that the processing is carried out, for example, on the basis of special guarantees, such as the officially recognized determination of a data protection level corresponding to the EU (e.g. for the USA by the "Privacy Shield") or compliance with officially recognized special contractual obligations
doc.dataprotection.in_accordance_with_the_legal=In accordance with the legal requirements, taking into account the state of the art, the implementation costs and the nature, extent, circumstances and purposes of the processing, as well as the different probability and severity of the risk for the rights and freedoms of natural persons, we take appropriate technical and organisational measures to ensure a level of protection appropriate to the risk.
doc.dataprotection.in_accordance_with_the_statutory=In accordance with the statutory requirements, you have the right to demand that relevant data be deleted immediately, or alternatively to demand a restriction of the processing of the data in accordance with the statutory requirements.
doc.dataprotection.in_the_event_that_the=In the event that the vital interests of the data subject or another natural person require the processing of personal data, Art. 6 par. 1 lit. d GDPR as legal basis.
doc.dataprotection.information_is_stored_for_security=\ information is stored for security reasons (e.g. to clarify abuse or fraud) for a maximum of 7 days and then deleted. Data whose further retention is necessary for the purposes of proof are exempted from deletion until the event is finally resolved
doc.dataprotection.measures_shall_include_in_particular=Measures shall include, in particular, ensuring the confidentiality, integrity and availability of data by controlling physical access to, access to, input, disclosure, availability and segregation of the data. In addition, we have set up procedures to ensure the exercise of data subject rights, the deletion of data and the response to data threats. Furthermore, we take into account the protection of personal data already during the development or selection of hardware, software and procedures, according to the principle of data protection through technical design and data protection-friendly presets.
doc.dataprotection.meta_communication_data_e_g=Meta/communication data (e.g., device information, IP addresses
doc.dataprotection.or_the_eu_side=or the EU side
doc.dataprotection.personal_data_means_any_information=‘personal data’ means any information relating to an identified or identifiable natural person (‘data subject’); identifiable is a natural person who can be identified directly or indirectly, in particular by assignment to an identifier such as a name, an identification number, location data, an online identifier (e.g. a cookie) or to one or more special characteristics that are an expression of the physical, physiological, genetic, psychological, economic, cultural or social identity of that natural person
doc.dataprotection.processing_means_any_operation_or=‘processing’ means any operation or series of operations carried out with or without the assistance of automated procedures in relation to personal data. The term extends far and includes virtually every handling of data.
doc.dataprotection.processor_means_a_natural_or=‘processor’ means a natural or legal person, public authority, body or other body that processes personal data on behalf of the controller;
doc.dataprotection.profiling_means_any_automated_processing=‘profiling’ means any automated processing of personal data which consists in the use of such personal data in order to assess certain personal aspects relating to a natural person, in particular in order to analyse or predict aspects relating to the performance, economic situation, health, personal preferences, interests, reliability, behaviour, location or change of location of that natural person.
doc.dataprotection.provision_of_the_online_offer=- Provision of the online offer, its functions and contents.
doc.dataprotection.pseudonymisation_means_the_processing_of=‘pseudonymisation’ means the processing of personal data in such a way that the personal data can no longer be attributed to a specific data subject without the use of additional information, provided that such additional information is kept separately and is subject to technical and organisational measures ensuring that the personal data are not attributed to an identified or identifiable natural person.
doc.dataprotection.purpose_of_processing=Purpose of processing
doc.dataprotection.reach_measurement_marketing=Reach Measurement/Marketing
doc.dataprotection.registration_function=Registration function
doc.dataprotection.relevant_legal_bases=Relevant legal bases
doc.dataprotection.right_of_appeal=Right of appeal
doc.dataprotection.right_of_withdrawal=Right of withdrawal
doc.dataprotection.rights_of_data_subjects=Rights of data subjects
doc.dataprotection.security_measures=- Security measures.
doc.dataprotection.security_measures_2=Security measures
doc.dataprotection.stock_data_e_g_personal=\ Stock data (e.g., personal master data, names or addresses
doc.dataprotection.terms_used=Terms used
doc.dataprotection.the_data_processed_by_us=The data processed by us will be deleted in accordance with the legal requirements or restricted in their processing. Unless expressly stated in the context of this data protection declaration, the data stored with us will be deleted as soon as they are no longer necessary for their purpose and the deletion does not conflict with any statutory storage obligations.
doc.dataprotection.the_hosting_services_we_use=The hosting services we use serve to provide the following services: infrastructure and platform services, computing capacity, storage space and database services, e-mail shipping, security services and technical maintenance services that we use for the purpose of operating this online offer.
doc.dataprotection.the_legal_basis_for_obtaining=The legal basis for obtaining consent is art. 6 par. 1 lit. a and art. 7 GDPR
doc.dataprotection.the_legal_basis_for_the=The legal basis for the processing to fulfill our services and carry out contractual measures as well as answering inquiries is art. 6 par. 1 lit. b GDPR
doc.dataprotection.the_legal_basis_for_the_2=The legal basis for the processing to fulfil our legal obligations is art. 6 par. 1 lit. c GDPR
doc.dataprotection.the_legal_basis_for_the_3=The legal basis for the necessary processing for the performance of a task in the public interest or carried out in the exercise of official authority delegated to the controller is art. 6 par. 1 lit. e GDPR.
doc.dataprotection.the_legal_basis_for_the_4=The legal basis for the processing for the protection of our legitimate interests is art. 6 par. 1 lit. f GDPR.
doc.dataprotection.the_processing_of_data_for=The processing of data for purposes other than those for which they have been transferred is governed by the provisions of Art. 6 para. 4 GDPR.
doc.dataprotection.the_processing_of_special_categories=The processing of special categories of data (according to Art. 9 para 1 GDPR) is governed by the provisions of Art. 9 par. 2 GDPR
doc.dataprotection.they_also_have_the_right=They also have the right, in accordance with the legal requirements, to submit a complaint to the competent supervisory authority.
doc.dataprotection.this_data_protection_declaration_clarifies=This data protection declaration clarifies you about the nature, scope and purpose of the processing of personal data (hereinafter referred to as "data") in the context of the provision of our services as well as within our online offer and the websites, functions and contents associated with it as well as external online presences, such as our social media profile (hereinafter referred to jointly as "online offer"). With regard to the terms used, such as “processing” or “responsible”, we refer to the definitions in art. 4 of the General Data Protection Regulation (GDPR
doc.dataprotection.transfers_to_third_countries=Transfers to third countries
doc.dataprotection.types_of_data_processed=Types of data processed
doc.dataprotection.usage_data_e_g_visited=\ Usage data (e.g., visited websites, interest in content, access times
doc.dataprotection.users_can_be_informed_by=Users can be informed by e-mail about information that is relevant to their user account, such as technical changes. If users have cancelled their user account, their data will be deleted with regard to the user account, subject to a statutory retention obligation. It is the responsibility of the users to secure their data upon termination before the end of the contract. We are entitled to irretrievably delete all data of the user stored during the contract period.
doc.dataprotection.users_can_create_a_user=Users can create a user account. In the context of registration, the necessary mandatory information is communicated to the users and based on the type. 6 par. 1 lit. b DSGVO is processed for the purposes of providing the user account. The processed data includes in particular the login information (name, password and an e-mail address). The data entered in the context of registration will be used for the purposes of using the user account and its purpose
doc.dataprotection.visitors_and_users_of_the=Visitors and users of the online offer (in the following we will collectively refer to the persons concerned as “users”
doc.dataprotection.we_ask_you_to_inform=We ask you to inform yourself regularly about the content of our data protection declaration. We adjust the privacy policy as soon as the changes to the data processing carried out by us make this necessary. We will inform you as soon as the changes require an act of cooperation on your part (e.g. consent) or other individual notification
doc.dataprotection.we_can_use_temporary_and=We can use temporary and permanent cookies and clarify this as part of our data protection declaration.
doc.dataprotection.we_delete_the_requests_if=We delete the requests if they are no longer necessary. We review the necessity every two years; Furthermore, the statutory archiving obligations apply
doc.dataprotection.we_or_our_hosting_provider=We, or our hosting provider, collects on the basis of our legitimate interests in the sense of the art. 6 par. GDPR data about every access to the server on which this service is located (so-called server logfiles). The access data include the name of the retrieved website, file, date and time of retrieval, amount of data transmitted, notification of successful retrieval, browser type and version, the user's operating system, referrer URL (the previously visited page), IP address and the requesting provider
doc.dataprotection.when_contacting_us_e_g=When contacting us (e.g. by contact form, e-mail, telephone or via social media), the information of the user for processing the contact request and its processing acc. Art. 6 para 1 lit. b. (in the context of contractual/pre-contractual relationships), Art. 6 para. 1 lit. f. (other requests) GDPR processed. The information of the users can be stored in a customer relationship management system ("CRM system") or comparable request organization
doc.dataprotection.you_can_object_to_the=You can object to the future processing of the data concerning you at any time in accordance with the legal requirements. The objection may in particular be made against the processing for direct marketing purposes.
doc.dataprotection.you_have_done_so_the=You have done so. the legal requirements the right to request the completion of the data concerning you or the correction of the incorrect data concerning you.
doc.dataprotection.you_have_the_right_to=You have the right to request confirmation of whether the data in question is processed and to obtain information about this data as well as further information and a copy of the data in accordance with the legal requirements.
doc.dataprotection.you_have_the_right_to_2=You have the right to request that the data concerning you, which you have provided to us in accordance with the legal requirements, be obtained and requested their transmission to other controllers.
doc.dataprotection.you_have_the_right_to_3=You have the right to revoke granted consent with effect for the future.

