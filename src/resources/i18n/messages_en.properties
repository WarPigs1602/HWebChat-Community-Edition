doc.impressum.our_offer_contains_links_to=Our offer contains links to external third-party websites on whose content we have no influence. Therefore, we cannot assume any guarantee for these third-party contents. For the contents of the linked pages is always the respective provider or operator of the pages responsible. The linked pages were checked for possible legal violations at the time of linking. Unlawful content was not recognizable at the time of linking. However, a permanent substantive control of the linked pages is unreasonable without concrete indications of a violation of rights. If infringements become known, we will immediately remove such links.
doc.impressum.represented_by=Represented by:
doc.impressum.phone=Tel:
doc.impressum.the_content_and_works_created=The content and works created by the site operators on these pages are subject to German copyright law. The reproduction, processing, distribution and any kind of exploitation outside the limits of copyright require the written consent of the respective author or creator. Downloads and copies of this site are only permitted for private, non-commercial use. If the content on this page has not been created by the operator, the copyrights of third parties are observed. In particular, content of third parties is marked as such. If you nevertheless become aware of a copyright infringement, we ask for a corresponding notice. If infringements become known, we will immediately remove such content.
doc.impressum.the_content_of_our_pages=The content of our pages has been created with the utmost care. However, we cannot assume any guarantee for the correctness, completeness and timeliness of the content. As a service provider, we are responsible according to § 7 Abs.1 TMG for our own content on these pages according to the general laws. According to §§ 8 to 10 TMG, however, we as a service provider are not obliged to monitor transmitted or stored third-party information or to search for circumstances that indicate illegal activity. Obligations to remove or block the use of information in accordance with general laws remain unaffected. However, liability in this regard is only possible from the time of knowledge of a concrete violation of rights. If appropriate infringements become known, we will remove this content immediately.
