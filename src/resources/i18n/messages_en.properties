doc.dataprotection.according_to_the_species_13=According to the species. 13 GDPR we inform you of the legal basis of our data processing. For users from the scope of the General Data Protection Regulation (GDPR), i.e. the EU and the EEC, if the legal basis is not mentioned in the data protection declaration, the following applies
