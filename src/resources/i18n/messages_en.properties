doc.dataprotection.are_explained_furthermore_the_storage=are explained. Furthermore, the storage of cookies can be achieved by switching them off in the browser settings. Please note that not all functions of this online offer can be used.
doc.dataprotection.as_part_of_the_use=As part of the use of our registration and registration functions as well as the use of the user account, we store the IP address and the time of the respective user action. The storage takes place on the basis of our legitimate interests, as well as the users in protection against misuse and other unauthorized use. In principle, this data is not passed on to third parties, unless it is necessary to pursue our claims or there is a legal obligation acc. Art. 6 para 1 lit. c. DSGVO. The IP addresses are anonymized or deleted after 7 days at the latest.
