<!-- design=frameset_community_reg -->
<h1>%SERVER_SOFTWARE% &ndash; Account l&ouml;schen</h1>

<form action="%PATH_[account_com]%" method="POST" accept-charset="utf-8">%account_error_if_one%
  <input type="hidden" name="service" value="delete">
  <input type="hidden" name="data" value="delete">

  <p class="form-section-title">Account l&ouml;schen</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Dein Passwort</label>
      <input type="password" class="form-control form-control-sm" name="pwd" value="" placeholder="Passwort">
      <span class="form-hint">Sollte mindestens vier Zeichen lang sein!</span>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Passwort wiederholen</label>
      <input type="password" class="form-control form-control-sm" name="pwd2" value="" placeholder="Passwort wiederholen">
      <span class="form-hint">Um sicherzustellen, dass Du Dich nicht verschrieben hast!</span>
    </div>
  </div>

  <p class="form-section-title">Best&auml;tigen</p>

  <input type="submit" class="btn btn-danger btn-sm" name="OK" value="Account l&ouml;schen">
</form>
