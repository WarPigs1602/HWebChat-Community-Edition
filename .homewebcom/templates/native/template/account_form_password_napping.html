<!-- design=napping -->
<h1>%SERVER_SOFTWARE% &ndash; Passwort</h1>

<form action="%PATH_[account]%" method="POST" accept-charset="utf-8">%account_error_if_one%
  <input type="hidden" name="service" value="password">
  <input type="hidden" name="data" value="change">

  <p class="form-section-title">Passwort &auml;ndern</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Altes Passwort</label>
      <input type="password" class="form-control form-control-sm" name="old_pwd" value="" placeholder="Altes Passwort">
      <span class="form-hint">Sollte mindestens vier Zeichen lang sein!</span>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Neues Passwort</label>
      <input type="password" class="form-control form-control-sm" name="new_pwd" value="" placeholder="Neues Passwort">
      <span class="form-hint">Sollte mindestens vier Zeichen lang sein!</span>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Neues Passwort wiederholen</label>
      <input type="password" class="form-control form-control-sm" name="new_pwd2" value="" placeholder="Neues Passwort wiederholen">
      <span class="form-hint">Um sicherzustellen, dass Du Dich nicht verschrieben hast!</span>
    </div>
  </div>

  <p class="form-section-title">Speichern</p>

  <input type="submit" class="btn btn-primary btn-sm" name="OK" value="&Auml;nderung abschicken">
</form>
