<!-- design=frameset_community_reg -->
<h1>
%SERVER_SOFTWARE% &ndash; Chatnapping
</h1>
<p class="alert alert-warning">
  Die Farben m&uuml;ssen Hexadezimal und Sechstellig sein!
</p>
<form action="%PATH_[account_com]%" method="POST" accept-charset="utf-8">
  <input type="hidden" name="service" value="napping">
  <input type="hidden" name="data" value="change">

  <p class="form-section-title">Notwendige Angaben</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Raumname</label>
      <input type="text" class="form-control form-control-sm" name="room2" value="%room2%" placeholder="Raumname">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Dein Chattitel</label>
      <input type="text" class="form-control form-control-sm" name="title" value="%title%" placeholder="Dein Chattitel">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Hintergrundfarbe 1</label>
      <input type="text" class="form-control form-control-sm" name="bg_color_1" value="%bg_color_1%" placeholder="RRGGBB">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Hintergrundfarbe 2</label>
      <input type="text" class="form-control form-control-sm" name="bg_color_2" value="%bg_color_2%" placeholder="RRGGBB Men&uuml;">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Farbe des Textes</label>
      <input type="text" class="form-control form-control-sm" name="color" value="%color%" placeholder="RRGGBB">
    </div>
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Farbe der Links</label>
      <input type="text" class="form-control form-control-sm" name="link_color" value="%link_color%" placeholder="RRGGBB">
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="form-label fw-semibold small">Rahmenfarbe</label>
      <input type="text" class="form-control form-control-sm" name="border_color" value="%border_color%" placeholder="RRGGBB">
    </div>
  </div>

  <p class="form-section-title">Speichern</p>

  <input type="submit" class="btn btn-primary btn-sm" name="OK" value="&Auml;nderung abschicken">
</form>
